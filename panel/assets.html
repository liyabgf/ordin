<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>资产 · Ordin</title>
    <style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#263733;background:#f7f8f6;--line:#dce3df;--muted:#697871;--teal:#176b59}
*{box-sizing:border-box} [hidden]{display:none!important} body{margin:0} button,input,textarea,select{font:inherit;color:inherit} button{cursor:pointer} button:disabled{opacity:.55;cursor:default} :focus-visible{outline:3px solid #238b75;outline-offset:2px}
header{max-width:1240px;margin:auto;padding:28px 28px 18px}h1{font-size:26px;margin:5px 0 6px}h2{font-size:21px;margin:0;overflow-wrap:anywhere}h3{font-size:16px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:.1em;font-weight:700}.muted{color:var(--muted);font-size:13px}
.toolbar{max-width:1240px;margin:auto;padding:8px 28px 18px;display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:160px}.toolbar select,.toolbar input,.btn{border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 12px;min-height:44px}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.error{max-width:1184px;margin:0 auto 14px;padding:12px;background:#fcf0ed;color:#8c3d35;border-left:3px solid #b05045;overflow-wrap:anywhere}
.layout{max-width:1240px;margin:auto;padding:8px 28px 36px;display:grid;grid-template-columns:minmax(260px,.85fr) minmax(0,1.5fr);gap:20px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:20px}
.asset{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:13px;margin:0 0 9px;background:#fff}.asset[aria-current=true]{border-color:#4b9b84;background:#f0f7f3}.asset-title{display:block;font-weight:650;overflow-wrap:anywhere}.asset-meta{display:block;margin-top:5px;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.badge{display:inline-block;padding:2px 7px;border-radius:5px;background:#edf3ef;color:#47665b;font-size:12px;margin:5px 5px 0 0}.badge.warn{background:#fbf0d8;color:#8b601f}.badge.bad{background:#faecea;color:#9b443b}.empty{padding:16px 0;color:var(--muted)}
.detail-head,.preview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}.detail-head>div{min-width:0}.description{white-space:pre-wrap;overflow-wrap:anywhere}.section{margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0;min-width:0}.field label{font-size:13px;color:var(--muted)}.field input,.field textarea,.field select{display:block;width:100%;min-width:0;max-width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{max-width:100%;white-space:normal;overflow-wrap:anywhere}.source-link{background:none;border:0;padding:0;min-height:44px;text-align:left;color:var(--teal);text-decoration:underline;overflow-wrap:anywhere}
.preview{min-width:0}.preview-head{margin-bottom:10px}.preview pre{padding:14px;margin:0;background:#f4f7f5;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:480px;overflow:auto;font:13px/1.7 ui-monospace,monospace}.preview img{max-width:100%;height:auto;display:block}.preview a{display:inline-block;overflow-wrap:anywhere;min-height:44px;color:var(--teal)}
@media(max-width:760px){header{padding:18px 14px 10px}.toolbar{padding:8px 14px 12px}.toolbar input{min-width:120px}.layout{padding:8px 14px 24px;grid-template-columns:minmax(0,1fr);gap:12px}.panel{padding:14px}.error{margin:0 14px 12px}}
.reference-row {display:block;max-width:100%;white-space:normal;overflow-wrap:anywhere}
    .toolbar > *, .btn, .source-link {max-width:100%;overflow-wrap:anywhere}
    .panel {overflow-wrap:anywhere}
    .btn, summary {white-space:normal}
    summary {cursor:pointer;min-height:44px;align-content:center}
    .toolbar input {min-width:0;flex-basis:10rem}
    .toolbar select {min-width:0}
    #preview:focus {outline:3px solid #238b75;outline-offset:2px}
</style>
  </head>
  <body>
    <header>
      <div class="eyebrow">ORDIN / LIBRARY</div>
      <h1>资产</h1>
      <div class="muted">集中查看可复用的文档、数据和代码。</div>
    </header>
    <div id="error" class="error" role="alert" hidden></div>
    <div id="write-warning" class="error" role="alert" hidden></div>
    <div class="toolbar">
      <input
        id="query"
        type="search"
        placeholder="搜索资产名称或说明"
        aria-label="搜索资产"
      /><select id="kind" aria-label="资产类型">
        <option value="">全部类型</option>
        <option value="document">文档</option>
        <option value="dataset">数据集</option>
        <option value="report">报告</option>
        <option value="code">代码</option>
        <option value="reference">参考资料</option></select
      ><select id="status" aria-label="资产状态">
        <option value="">全部状态</option>
        <option value="active">可用</option>
        <option value="candidate">待确认</option>
        <option value="archived">已归档</option></select
      ><button id="refresh" class="btn">刷新</button
      ><button id="import-open" class="btn primary">导入文本</button>
    </div>
    <main class="layout">
      <section class="panel" aria-label="资产列表">
        <div><b>资产列表</b> <span id="count" class="muted"></span></div>
        <p id="list-loading" class="muted" role="status" hidden></p>
        <div id="list" aria-live="polite" class="empty">正在读取资产…</div>
      </section>
      <section class="panel" aria-label="资产详情">
        <div id="detail">
          <h2>选择一项资产</h2>
          <p class="muted">从左侧列表查看详情和预览。</p>
        </div>
        <div id="import-panel" class="section" hidden>
          <h3>导入文本</h3>
          <div class="field">
            <label for="import-name">名称</label><input id="import-name" />
          </div>
          <div class="field">
            <label for="import-kind">类型</label
            ><select id="import-kind">
              <option value="document">文档</option>
              <option value="dataset">数据集</option>
              <option value="report">报告</option>
              <option value="code">代码</option>
              <option value="reference">参考资料</option>
            </select>
          </div>
          <div class="field">
            <label for="import-description">说明</label
            ><textarea id="import-description"></textarea>
          </div>
          <div class="field">
            <label for="import-text">正文</label
            ><textarea id="import-text"></textarea>
          </div>
          <div class="actions">
            <button id="import-submit" class="btn primary">导入</button
            ><button id="import-cancel" class="btn">取消</button>
          </div>
        </div>
      </section>
    </main>
    <script>
      (function () {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const state = {
          assets: [],
          selected: null,
          detail: null,
          filters: { query: "", kind: "", status: "" },
          listGeneration: 0,
          detailGeneration: 0,
          contentGeneration: 0,
          pending: false,
          uncertainWrite: null,
          objectUrl: null,
          drafts: {},
          initialized: false,
        };
        const labels = {
          document: "文档",
          dataset: "数据集",
          report: "报告",
          code: "代码",
          reference: "参考资料",
        };
        const statusLabels = { active: "可用", candidate: "待确认" };
        const deliveryLabels = { selected: "已选（任务已关联此固定版本），尚无读取或使用证据", queued: "已保存待投递", delivered: "已送达执行端；不代表已读取或使用成功", "not-delivered": "任务结束时尚未送达" };
        function statusLabel(a) { return a.archived === true ? "已归档" : (Object.hasOwn(statusLabels, a.status) ? statusLabels[a.status] : "状态未知"); }
        function esc(v) {
          return String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        }
        function showError(e) {
          $("error").textContent = e?.message || String(e);
          $("error").hidden = false;
        }
        function clearError() {
          $("error").hidden = true;
          $("error").textContent = "";
        }
        async function api(path, options) {
          let r;
          try {
            r = await fetch("/ordin/api/" + path, { ...options, headers: { "x-ordin-request": "1", ...(options?.headers || {}) } });
          } catch {
            throw Error("无法连接服务，请检查连接");
          }
          let d;
          try {
            d = await r.json();
          } catch {
            throw Error("响应格式不正确");
          }
          if (!r.ok)
            throw Object.assign(Error(
              d?.error?.message ||
                d?.error ||
                d?.message ||
                "请求失败（HTTP " + r.status + "）",
            ), { rejected: r.status >= 400 && r.status < 500 });
          return d;
        }
        function query() {
          const p = new URLSearchParams();
          if (state.filters.query) p.set("query", state.filters.query);
          if (state.filters.kind) p.set("kind", state.filters.kind);
          p.set("includeArchived", "true");
          p.set("limit", "200");
          return p.toString();
        }
        function visible() {
          return state.assets.filter(
            (a) =>
              (!state.filters.status || (a.archived === true ? "archived" : a.status) === state.filters.status) &&
              (!state.filters.kind || a.kind === state.filters.kind) &&
              (!state.filters.query ||
                [a.name, a.description, ...(a.tags || [])]
                  .join(" ")
                  .toLowerCase()
                  .includes(state.filters.query.toLowerCase())),
          );
        }
        function renderList() {
          const items = visible();
          $("count").textContent = items.length + " 项";
          const list = $("list");
          const focusedId = document.activeElement?.dataset?.id;
          if (!state.loadedList) return;
          if (!items.length) {
            list.className = "empty";
            list.textContent = "没有符合条件的资产。";
            return;
          }
          list.className = "";
          list.replaceChildren(
            ...items.map((a) => {
              const b = document.createElement("button");
              b.className = "asset";
              b.type = "button";
              b.dataset.id = a.id;
              b.setAttribute("aria-current", String(a.id === state.selected));
              const source =
                a.source?.availability === "available"
                  ? a.source.ticketTitle || a.source.ticketId || "来源任务"
                  : a.source?.availability === "deleted"
                    ? "来源任务已删除"
                    : "来源缺失";
              b.innerHTML =
                '<span class="asset-title">' +
                esc(a.name) +
                '</span><span class="asset-meta">' +
                esc((a.description || "暂无说明").slice(0, 160)) +
                '</span><span class="badge">' +
                esc(labels[a.kind] || a.kind) +
                '</span><span class="badge ' +
                (a.status === "candidate" ? "warn" : "") +
                '">' +
                esc(statusLabel(a)) +
                '</span><span class="asset-meta">' +
                esc(source) +
                "</span>";
              b.onclick = async () => {
                if (await select(a.id)) await loadContent(a.id);
              };
              return b;
            }),
          );
          if (focusedId) Array.from(list.children).find(button => button.dataset.id === focusedId)?.focus();
        }
        function sourceButton(source) {
          if (!source?.ticketId || source.availability !== "available")
            return esc(
              source?.availability === "deleted"
                ? "来源任务已删除"
                : "暂无可用来源",
            );
          return taskButton(source.ticketId, source.ticketTitle || source.ticketId);
        }
        function taskButton(ticketId, label) {
          const b = document.createElement("button");
          b.className = "source-link";
          b.type = "button";
          b.textContent = label;
          b.onclick = () => {
            if (window.parent === window) {
              location.assign("/ordin/workspace?ticket=" + encodeURIComponent(ticketId));
              return;
            }
            window.parent?.postMessage({ type: "ordin:navigate", tab: "workspace", ticketId }, location.origin);
          };
          return b;
        }
        function renderDetail() {
          const a = state.detail;
          if (!a) {
            $("detail").innerHTML =
              '<h2>选择一项资产</h2><p class="muted">从左侧列表查看详情和预览。</p>';
            return;
          }
          const source = sourceButton(a.source);
          const draft = state.drafts[a.id] || a;
          $("detail").innerHTML =
            '<div class="detail-head"><div><h2>' +
            esc(a.name) +
            '</h2><p class="description">' +
            esc(a.description || "暂无说明") +
            '</p></div><span class="badge ' +
            (a.status === "candidate" ? "warn" : "") +
            '">' +
            esc(statusLabel(a)) +
            '</span></div>' +
            (a.status === "candidate" ? '<p class="muted">待确认资产可浏览，但尚未验收通过；目前不能添加到新任务草稿。</p>' : "") +
            (a.archived === true ? '<p class="muted">已归档：保留版本和引用记录，不能作为新任务的可用资产。</p>' : "") +
            (!a.managed ? '<p class="muted">旧资产尚未独立保存；预览可能不可用。</p>' : "") +
            '<p class="muted">' +
            esc(labels[a.kind] || a.kind) + " · " + esc(a.updatedAt || "更新时间未知") +
            '</p><details class="section"><summary>技术信息（版本、格式与完整性）</summary><p class="muted">版本：' + esc(a.revision ?? "未知") + '</p><p class="muted">' +
            (typeof a.mimeType === "string" && a.mimeType ? "格式：" + esc(a.mimeType) + " · " : "") +
            (Number.isSafeInteger(a.size) && a.size >= 0 ? esc(a.size) + " 字节" : "大小未知") +
            '</p><p class="muted">内容 hash：' + esc(a.contentHash || "未知") + '</p></details><div class="section"><b>来源</b><p id="asset-source"></p></div><div class="section"><b>元数据</b><div class="field"><label for="edit-name">名称</label><input style="width:100%;max-width:100%;box-sizing:border-box" id="edit-name" value="' +
            esc(draft.name) +
            '"></div><div class="field"><label for="edit-description">说明</label><textarea style="width:100%;max-width:100%;box-sizing:border-box" id="edit-description">' +
            esc(draft.description || "") +
            '</textarea></div><div class="field"><label for="edit-tags">标签（逗号分隔）</label><input style="width:100%;max-width:100%;box-sizing:border-box" id="edit-tags" value="' +
            esc(
              Array.isArray(draft.tags) ? draft.tags.join(", ") : draft.tags,
            ) +
            '"></div><div class="actions"><button id="save-meta" class="btn primary">保存</button><button id="archive-asset" class="btn">' +
            (a.archived ? "恢复" : "归档") +
            '</button><button id="load-content" class="btn">打开预览</button></div></div><div id="preview" class="preview section" aria-labelledby="preview-title" tabindex="-1" hidden><div class="preview-head"><b id="preview-title"></b><button id="preview-close" class="btn" type="button">关闭预览</button></div><div id="preview-body" aria-live="polite"></div></div>';
          $("asset-source").replaceChildren(source);
          const relationPanel = document.createElement("div");
          relationPanel.id = "asset-relations";
          relationPanel.className = "section";
          relationPanel.innerHTML = '<b>相关资产</b>';
          if (a.relations?.error) { const message = document.createElement("p"); message.className = "muted"; message.textContent = "关系暂不可用：" + a.relations.error + "。资产详情仍可查看，重新选择此资产可重试读取。"; relationPanel.appendChild(message); }
          const related = a.relations?.related || [];
          if (!related.length && !a.relations?.error) { const empty = document.createElement("p"); empty.className = "muted"; empty.textContent = "暂无同源或共同选用的资产。"; relationPanel.appendChild(empty); }
          for (const item of related) { const button = document.createElement("button"); button.type="button"; button.className="source-link"; button.textContent=String(item.name)+" · "+String(item.reason); button.onclick=()=>select(item.id); relationPanel.appendChild(button); }
          const refs = a.relations?.references || [];
          const refSection = document.createElement("div"); refSection.className="section"; const refTitle=document.createElement("b"); refTitle.textContent="任务引用记录"; refSection.appendChild(refTitle);
          if (!refs.length && !a.relations?.error) { const empty=document.createElement("p"); empty.className="muted"; empty.textContent="尚无固定版本的任务引用"; refSection.appendChild(empty); }
          for (const ref of refs) {
            const label = String(ref.title || ref.ticketId || "任务") + " · v" + String(ref.revision) + " · " +
              (Object.hasOwn(deliveryLabels, ref.state) ? deliveryLabels[ref.state] : "引用状态未知");
            const row = typeof ref.ticketId === "string" && ref.ticketId ? taskButton(ref.ticketId, label) : document.createElement("p");
            row.classList?.add("reference-row");
            if (row.tagName?.toLowerCase() === "p") row.textContent = label;
            refSection.appendChild(row);
          }
          $("detail").appendChild(relationPanel); $("detail").appendChild(refSection);
          ["edit-name", "edit-description", "edit-tags"].forEach((id) => {
            $(id).oninput = rememberDraft;
          });
          updateWriteButtons();
          $("save-meta").onclick = saveMeta;
          $("archive-asset").onclick = toggleArchive;
          $("load-content").onclick = () => loadContent(a.id);
          $("preview-close").onclick = () => {
            closePreview();
            $("load-content").focus?.();
          };
          const suggest = document.createElement("button");
          suggest.id = "suggest-description";
          suggest.type = "button";
          suggest.className = "btn";
          suggest.textContent = "生成 AI 说明建议";
          suggest.disabled = !a.managed || a.archived === true;
          const suggestion = document.createElement("p");
          suggestion.id = "description-suggestion";
          suggestion.className = "description muted";
          suggestion.setAttribute("role", "status");
          suggestion.textContent = "生成时会将最多 8 KiB 文本摘录发送给已配置的模型。";
          const adopt = document.createElement("button");
          adopt.id = "adopt-description";
          adopt.className = "btn";
          adopt.type = "button";
          adopt.textContent = "填入说明草稿";
          adopt.hidden = true;
          suggest.onclick = async () => {
            if (suggest.disabled) return;
            adopt.hidden = true;
            suggest.disabled = true;
            suggestion.textContent = "正在生成说明建议…";
            try {
              const result = await api("assets/" + encodeURIComponent(a.id) + "/description-suggestion", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ revision: a.revision }),
              });
              if (state.detail !== a) return;
              if (result.revision !== a.revision || typeof result.description !== "string" || !result.description.trim()) throw Error("建议与当前版本不匹配");
              adopt.onclick = () => {
                if (state.detail !== a || state.pending || adopt.hidden) return;
                const field = $("edit-description");
                const saved = String(a.description || "").replace(/\r\n?/g, "\n");
                if (field.value !== saved) {
                  suggestion.textContent = "说明已有未保存修改；未覆盖草稿。建议：" + result.description;
                  return;
                }
                field.value = result.description;
                rememberDraft();
                adopt.hidden = true;
                suggestion.textContent = "已填入说明草稿，尚未保存。";
                field.focus?.();
              };
              adopt.hidden = false;
              suggestion.textContent = "AI 建议（尚未保存）：" + result.description;
              const diagnostics = document.createElement("details");
              const summary = document.createElement("summary");
              summary.textContent = "建议生成信息";
              diagnostics.appendChild(summary);
              const info = document.createElement("p");
              info.textContent = result.model + " · 版本 " + result.revision + " · " + result.generatedAt;
              diagnostics.appendChild(info);
              suggestion.appendChild(diagnostics);
            } catch (e) {
              suggestion.textContent = "说明建议不可用：" + e.message;
            } finally {
              suggest.disabled = false;
            }
          };
          // Append to this render only; a late response cannot replace another asset's details.
          $("detail").appendChild(suggest);
          $("detail").appendChild(suggestion);
          $("detail").appendChild(adopt);
          const use = document.createElement("button");
          use.type = "button";
          use.id = "use-in-new-task";
          use.className = "btn primary";
          use.textContent = "添加到任务草稿";
          use.disabled = !a.managed || a.status !== "active" || a.archived === true || !a.contentHash;
          use.onclick = () => {
            if (use.disabled) return;
            window.parent?.postMessage({ type: "ordin:use-asset", assetRef: {
              id: a.id, revision: a.revision, contentHash: a.contentHash,
            } }, location.origin);
          };
          $("detail").appendChild(use);
          const useHint = document.createElement("p");
          useHint.className = "muted";
          useHint.textContent = use.disabled ? "此资产目前不能用于新任务草稿。" : "仅在草稿中选入此固定版本，提交任务后才会关联。";
          $("detail").appendChild(useHint);
        }
        async function refresh() {
          const generation = ++state.listGeneration;
          $("list-loading").hidden = false;
          $("list-loading").textContent = "正在读取资产…";
          const previous = state.assets.slice();
          const hadList = state.loadedList === true;
          try {
            const d = await api("assets?" + query());
            if (generation !== state.listGeneration) return;
            if (!Array.isArray(d.assets)) throw Error("响应格式不正确");
            state.assets = d.assets;
            state.loadedList = true;
            renderList();
            clearError();
            if (
              state.selected &&
              !state.assets.some((a) => a.id === state.selected)
            ) {
              rememberDraft();
              closePreview();
              ++state.detailGeneration;
              state.selected = null;
              state.detail = null;
              renderDetail();
            }
            return true;
          } catch (e) {
            if (generation !== state.listGeneration) return;
            state.assets = previous;
            if (hadList) renderList();
            else $("list").textContent = "资产列表暂不可用。";
            showError("无法读取资产列表：" + e.message + (hadList ? "（已保留上次内容和筛选）" : "（已保留筛选）") + "。请点刷新重试读取。");
          } finally {
            if (generation === state.listGeneration)
              $("list-loading").hidden = true;
          }
        }
        async function select(id) {
          const previous = state.detail?.id === id ? state.detail : null;
          rememberDraft();
          if (!previous) closePreview();
          const generation = ++state.detailGeneration;
          state.selected = id;
          renderList();
          if (!previous) {
            state.detail = null;
            $("detail").textContent = "正在读取资产详情…";
          }
          try {
            const [d, relations] = await Promise.all([api("assets/" + encodeURIComponent(id)), api("assets/" + encodeURIComponent(id) + "/relations").catch(e => ({error: e?.message || String(e)}))]);
            if (generation !== state.detailGeneration) return;
            if (!d || d.id !== id || !Number.isSafeInteger(d.revision)) throw Error("响应格式不正确");
            if (previous) closePreview();
            state.detail = { ...d, relations };
            renderDetail();
            clearError();
            return true;
          } catch (e) {
            if (generation !== state.detailGeneration) return;
            if (!previous) $("detail").textContent = "资产详情暂不可用。";
            showError("无法读取资产详情：" + e.message + (previous ? "。已保留之前的详情、预览和草稿。" : "。已保留列表和草稿。") + "请重新选择该资产以重试读取。");
          }
        }
        function rememberDraft() {
          if (state.detail)
            state.drafts[state.detail.id] = {
              name: $("edit-name").value,
              description: $("edit-description").value,
              tags: $("edit-tags").value,
            };
        }
        function closePreview() {
          ++state.contentGeneration;
          if (state.objectUrl) {
            URL.revokeObjectURL(state.objectUrl);
            state.objectUrl = null;
          }
          const p = $("preview");
          if (p) {
            p.hidden = true;
            $("preview-body").replaceChildren();
            $("preview-title").textContent = "";
          }
        }
        async function loadContent(id) {
          closePreview();
          const generation = ++state.contentGeneration;
          const p = $("preview");
          p.hidden = false;
          $("preview-title").textContent = "内容预览";
          p.focus?.();
          $("preview-body").textContent = "正在读取内容…";
          try {
            const d = await api(
              "assets/" + encodeURIComponent(id) + "/content",
            );
            if (generation !== state.contentGeneration || state.selected !== id)
              return;
            if (!d || typeof d.base64 !== "string" || typeof d.text !== "boolean") throw Error("响应格式不正确");
            const body = $("preview-body");
            body.replaceChildren();
            $("preview-title").textContent = "内容预览";
            if (d.text) {
              const pre = document.createElement("pre");
              pre.textContent = decodeBase64(d.base64);
              body.appendChild(pre);
            } else {
              const bytes = decodeBytes(d.base64);
              if (/^image\/(png|jpeg|gif|webp)$/i.test(d.mimeType || "")) {
                const img = document.createElement("img");
                const blob = new Blob([bytes], { type: d.mimeType });
                const url = URL.createObjectURL(blob);
                state.objectUrl = url;
                img.src = url;
                img.alt = "资产图片预览";
                body.appendChild(img);
              } else {
                const a = document.createElement("a");
                const blob = new Blob([bytes], {
                  type: d.mimeType || "application/octet-stream",
                });
                const url = URL.createObjectURL(blob);
                state.objectUrl = url;
                a.href = url;
                a.download = a.textContent = "下载文件";
                body.appendChild(a);
              }
            }
          } catch (e) {
            if (generation !== state.contentGeneration) return;
            $("preview-title").textContent = "读取失败";
            $("preview-body").textContent = "无法读取预览：" + e.message + "。资产详情和草稿仍保留。请关闭预览，或重试读取。";
            const retry = document.createElement("button");
            retry.type = "button";
            retry.className = "btn";
            retry.textContent = "重试读取预览";
            retry.onclick = () => loadContent(id);
            $("preview-body").appendChild(retry);
          }
        }
        function decodeBytes(b64) {
          const raw = atob(b64);
          const out = new Uint8Array(raw.length);
          for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
          return out;
        }
        function decodeBase64(b64) {
          return new TextDecoder().decode(decodeBytes(b64));
        }
        function updateWriteButtons() {
          const disabled = state.pending || !!state.uncertainWrite;
          $("import-submit").disabled = disabled;
          $("import-cancel").disabled = state.pending;
          if (state.detail) {
            $("save-meta").disabled = disabled;
            $("archive-asset").disabled = disabled;
          }
        }
        function writeError(e, action, assetId) {
          if (e.rejected) {
            showError(action + "被拒绝：" + e.message + "。已保留输入。请检查提示后再操作；版本冲突时先重新打开资产核对。");
            return;
          }
          state.uncertainWrite = { assetId };
          const warning = $("write-warning");
          warning.textContent = action + "结果不确定（" + e.message + "），可能已生效。已保留输入和最后读取的信息。请点刷新核对当前状态，再决定是否重新提交。";
          warning.hidden = false;
        }
        async function refreshAndCheck() {
          const uncertain = state.uncertainWrite;
          if (!await refresh() || !uncertain || state.uncertainWrite !== uncertain) return;
          if (uncertain.assetId) {
            if (!await select(uncertain.assetId) || state.uncertainWrite !== uncertain) return;
          }
          state.uncertainWrite = null;
          updateWriteButtons();
          $("write-warning").textContent = uncertain.assetId
            ? "已读取当前状态。请核对资产详情，再决定是否重新提交。"
            : "已读取当前列表。请搜索导入时的名称或清除筛选核对，再决定是否重新提交。";
        }
        async function saveMeta() {
          if (!state.detail || state.pending || state.uncertainWrite) return;
          const a = state.detail;
          const generation = state.detailGeneration;
          rememberDraft();
          const name = $("edit-name").value.trim();
          if (!name) {
            showError("名称不能为空");
            return;
          }
          state.pending = true;
          updateWriteButtons();
          try {
            const d = await api("assets/" + encodeURIComponent(a.id), {
              method: "PATCH",
              headers: {
                "content-type": "application/json",
                "x-ordin-request": "1",
              },
              body: JSON.stringify({
                expectedRevision: a.revision,
                name,
                description: $("edit-description").value,
                tags: $("edit-tags")
                  .value.split(",")
                  .map((x) => x.trim())
                  .filter(Boolean),
              }),
            });
            if (!d || d.id !== a.id || !Number.isSafeInteger(d.revision)) throw Error("响应格式不正确");
            delete state.drafts[a.id];
            state.assets = state.assets.map((x) => (x.id === d.id ? d : x));
            renderList();
            if (
              state.selected === a.id &&
              generation === state.detailGeneration
            ) {
              closePreview();
              state.detail = { ...d, relations: a.relations };
              renderDetail();
              clearError();
            }
          } catch (e) {
            writeError(e, "保存资产信息", a.id);
          } finally {
            state.pending = false;
            updateWriteButtons();
          }
        }
        async function toggleArchive() {
          if (!state.detail || state.pending || state.uncertainWrite) return;
          const a = state.detail;
          const generation = state.detailGeneration;
          rememberDraft();
          state.pending = true;
          updateWriteButtons();
          try {
            const d = await api("assets/" + encodeURIComponent(a.id), {
              method: "PATCH",
              headers: {
                "content-type": "application/json",
                "x-ordin-request": "1",
              },
              body: JSON.stringify({
                expectedRevision: a.revision,
                archived: !a.archived,
              }),
            });
            if (!d || d.id !== a.id || !Number.isSafeInteger(d.revision)) throw Error("响应格式不正确");
            state.assets = state.assets.map((x) => (x.id === d.id ? d : x));
            renderList();
            if (
              state.selected === a.id &&
              generation === state.detailGeneration
            ) {
              closePreview();
              state.detail = { ...d, relations: a.relations };
              renderDetail();
              clearError();
            }
          } catch (e) {
            writeError(e, "更改归档状态", a.id);
          } finally {
            state.pending = false;
            updateWriteButtons();
          }
        }
        async function importText() {
          if (state.pending || state.uncertainWrite) return;
          const name = $("import-name").value.trim(),
            text = $("import-text").value;
          if (!name || !text) {
            showError("名称和正文不能为空");
            return;
          }
          state.pending = true;
          updateWriteButtons();
          try {
            const imported = await api("assets/import", {
              method: "POST",
              headers: {
                "content-type": "application/json",
                "x-ordin-request": "1",
              },
              body: JSON.stringify({
                text,
                name,
                kind: $("import-kind").value,
                description: $("import-description").value,
                tags: [],
              }),
            });
            if (!imported || typeof imported.id !== "string" || !Number.isSafeInteger(imported.revision)) throw Error("响应格式不正确");
            $("import-panel").hidden = true;
            $("import-open").focus?.();
            ["import-name", "import-text", "import-description"].forEach(
              (id) => {
                $(id).value = "";
              },
            );
            await refresh();
          } catch (e) {
            writeError(e, "导入资产");
          } finally {
            state.pending = false;
            updateWriteButtons();
          }
        }
        $("query").oninput = () => {
          state.filters.query = $("query").value;
          refresh();
        };
        $("kind").onchange = () => {
          state.filters.kind = $("kind").value;
          refresh();
        };
        $("status").onchange = () => {
          state.filters.status = $("status").value;
          renderList();
        };
        $("refresh").onclick = refreshAndCheck;
        $("import-open").onclick = () => {
          $("import-panel").hidden = false;
          $("import-name").focus?.();
        };
        $("import-cancel").onclick = () => {
          $("import-panel").hidden = true;
          $("import-open").focus?.();
        };
        $("import-submit").onclick = importText;
        function init() {
          if (state.initialized) return Promise.resolve();
          state.initialized = true;
          $("import-kind").value = "document";
          return refresh();
        }
        window.AssetLibrary = { init, select, refresh, closePreview, state };
        window.addEventListener?.("pagehide", closePreview);
        window.addEventListener?.("beforeunload", closePreview);
        if (document.readyState === "loading")
          document.addEventListener("DOMContentLoaded", init);
        else if (document.readyState) init();
      })();
    </script>
  </body>
</html>
