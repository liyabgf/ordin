<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordin</title>
<style>
:root{color-scheme:light;font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#263733;background:#f6f7f5;--ink:#263733;--muted:#68766f;--line:#dce3df;--surface:#fff;--soft:#edf4f0;--accent:#176b59;--danger:#a63832;--warn:#8a5a18}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-width:0}
button,input,textarea,select{font:inherit;color:inherit}
button,summary,a{touch-action:manipulation}
button,summary{cursor:pointer}
button{min-height:42px;padding:8px 13px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
button:hover{background:var(--soft)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #238b75;outline-offset:2px}
a{color:var(--accent)}
input,select,textarea{max-width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--surface)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
aside{min-width:0;padding:22px 16px;display:flex;flex-direction:column;gap:18px;background:#f0f2ed;border-right:1px solid var(--line)}
.side-head{display:flex;flex-direction:column;gap:12px}
.side-head b{color:var(--muted);font-size:12px;font-weight:650}
#conversation-new,#send{color:#fff;background:var(--accent);border-color:var(--accent)}
#conversation-list{min-height:80px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.conversation-item{width:100%;min-width:0;display:flex;justify-content:space-between;gap:8px;text-align:left;background:transparent;border-color:transparent}
.conversation-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conversation-item small{flex:none;font-size:11px;color:var(--muted)}
.conversation-item[aria-current=true]{background:#fff;border-color:var(--line)}
.history-tools{display:flex;flex-wrap:wrap;gap:6px}
.history-tools button{font-size:12px}
.advanced{margin-top:auto;font-size:13px}
.task-continue{display:flex;flex-direction:column;gap:8px;margin:12px 0}
#task-id{width:100%}
.workspace{min-width:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.workspace>header{min-height:58px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px clamp(16px,3vw,40px);border-bottom:1px solid var(--line);background:#fff}
.header-spacer{flex:1}
#conversation-title{font-weight:650}
#conversation-title-input{width:min(360px,100%)}
.workspace>header label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
#chat-model{max-width:250px}
.workspace>header details{position:relative}
.workspace>header details>div{position:absolute;z-index:5;top:100%;right:0;display:grid;min-width:190px;padding:8px;gap:5px;background:#fff;border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 30px #26373318}
.readiness{flex:0 0 100%;color:var(--muted);font-size:12px}
#workspace{min-height:0;padding:0}
#log{flex:1;min-height:0;overflow:auto;padding:24px 28px}
#log:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
footer,.workspace>header{flex:none}
.welcome{flex:none}
#log,.welcome{width:min(820px,100%);margin:0 auto}
.welcome{padding:clamp(24px,5vh,56px) 0 22px}
.mark{color:var(--accent);font-size:24px}
.welcome h1{margin:8px 0;color:var(--ink);font-size:27px;line-height:1.25;font-weight:650}
.welcome p{max-width:660px;margin:0 0 20px;color:var(--muted)}
.examples{display:flex;flex-wrap:wrap;gap:8px}
.example{text-align:left}
.msg{display:flex;margin:0 0 20px}
.msg.user{justify-content:flex-end}
.bubble{max-width:min(80%,720px);padding:12px 16px;border-radius:10px;background:#fff;border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user .bubble{background:#eaf3ee;border-color:#d8e7df}
.msg.ordin .bubble{background:transparent;border-color:transparent;padding-left:0}
.task-card{width:min(720px,100%);margin:10px 0 18px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff}
.task-card a{display:inline-block;margin-top:8px}
.working,#send-feedback,.send-recovery{width:min(820px,100%);margin:0 auto 10px;color:var(--muted)}
.send-recovery{display:flex;flex-wrap:wrap;gap:8px}.composer-label{display:block;width:min(820px,100%);margin:0 auto 4px}.task-card,#conversation-title,.asset-chip,#conversation-error,.error{overflow-wrap:anywhere}.workspace>header label{min-width:0}
.error:empty{display:none}
.error{width:min(820px,100%);margin:10px auto;padding:10px 12px;border-left:3px solid var(--danger);background:#fbefee;color:#6d302d}
footer{padding:12px clamp(16px,4vw,56px) 16px;border-top:1px solid var(--line);background:#fff}
.composer{width:min(820px,100%);display:flex;align-items:flex-end;gap:10px;margin:0 auto}
#input{flex:1;min-width:0;min-height:52px;max-height:180px;resize:vertical}
.hint{width:min(820px,100%);margin:5px auto 0;color:var(--muted);font-size:12px}
.asset-tools{width:min(820px,100%);margin:0 auto 7px}.asset-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.asset-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px}.asset-chip button{min-height:24px;padding:0 5px}.asset-picker{width:min(820px,100%);margin:0 auto 7px;padding:8px;border:1px solid var(--line);background:#fff}.asset-picker input{width:100%}.asset-results{max-height:180px;overflow:auto}.asset-results button{width:100%;text-align:left;margin-top:4px}.asset-error{color:var(--danger);font-size:12px}
#conversation-error{color:var(--danger);font-size:12px}
@media(max-width:760px),(max-height:600px){.shell{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
aside{height:auto;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
.side-head{flex-direction:row;align-items:center;justify-content:space-between}
#conversation-list{min-height:40px;max-height:16dvh}
.advanced{margin-top:0}
.workspace{height:auto;overflow:visible}
#log{overflow:visible}
.welcome{padding:16px 14px}
.workspace>header{padding:8px 12px;gap:8px}
#chat-model{min-width:0;max-width:min(170px,60vw)}
.workspace>header details>div{position:static;min-width:0;box-shadow:none}
.composer{flex-wrap:wrap}
#workspace{padding:0}
#log{padding:16px 14px}
.welcome h1{font-size:23px}
.bubble{max-width:92%}
footer{padding:9px 12px 12px}
}

</style>
</head>
<body>
<div class="shell">
  <aside aria-label="对话历史">
    <div class="side-head"><b>对话历史</b><button id="conversation-new" type="button">＋ 新对话</button></div>
    <div class="history-tools"><button id="conversation-refresh" type="button" title="刷新对话列表">刷新</button><button id="history-retry" type="button" title="重新读取消息">重试历史</button><button id="history-older" type="button" hidden>更早消息</button></div>
    <nav id="conversation-list" aria-label="对话列表"></nav>
    <details class="advanced"><summary>高级工具</summary><div class="task-continue"><label for="task-id">任务 ID</label><input id="task-id" type="text" placeholder="完整任务 ID"><button id="continue-task" type="button">带着任务上下文开启新对话</button></div></details>
    <div id="conversation-error" role="alert" aria-live="polite"></div>
  </aside>
  <section class="workspace" id="workspace">
    <header><b>Ordin</b><span id="conversation-title"></span><input id="conversation-title-input" aria-label="对话标题" maxlength="200" hidden><span class="header-spacer"></span><label for="chat-model">模型 <select id="chat-model"><option value="">使用默认模型</option></select></label><details><summary>更多</summary><div class="more-actions"><button id="conversation-rename" type="button">重命名</button><button id="conversation-archive" type="button">归档</button><button id="conversation-delete" type="button">删除</button><button id="settings-open" type="button">对话与执行设置</button></div></details><span class="readiness" id="readiness-status" role="status">正在检查设置…</span></header>
    <section class="welcome" id="welcome" hidden><div class="mark" aria-hidden="true">✦</div><h1 id="welcome-title">聊聊想法，或交代一件事</h1><p>先讨论想法、梳理计划；想让 Ordin 执行时，请说清要交办的工作和预期结果。创建成功后，可从任务卡查看进度。</p><div class="examples"><button id="example-summarize" class="example" type="button">总结一段内容</button><button id="example-plan" class="example" type="button">梳理工作计划</button><button id="example-explain" class="example" type="button">一起分析问题</button></div></section>
    <main id="log" role="log" aria-label="对话消息" tabindex="0"></main>
    <div class="working" id="working" role="status" hidden>Ordin 正在思考并处理你的消息…</div><div class="error" id="send-feedback" role="alert"></div><div class="send-recovery" id="send-recovery" hidden><button id="send-retry" type="button">读取对话记录</button><button id="resend-action" type="button" hidden>再次提交原消息</button><a id="review-tasks" href="/ordin/?tab=workspace">查看任务工作台</a></div>
    <footer><div class="asset-tools"><div id="asset-chips" class="asset-chips" aria-label="聊天草稿已选资产"></div><button id="asset-open" type="button">添加资产</button><div id="asset-picker" class="asset-picker" hidden><input id="asset-query" type="search" placeholder="搜索资产" aria-label="搜索资产"><div id="asset-results" class="asset-results"></div><div id="asset-error" class="asset-error" role="alert"></div></div></div><label class="composer-label" for="input">消息</label><div class="composer"><textarea id="input" aria-describedby="hint" placeholder="说点什么，或交代一件事"></textarea><button id="send" type="button">发送</button></div><div class="hint" id="hint">Enter 发送 · Shift+Enter 换行。明确交办后，若创建成功，可从任务卡跟进。</div></footer>
  </section>
</div>
<script>
(() => {
  const API = "/ordin/api/"
  const SELECTED_KEY = "ordin.chat.selectedConversation"
  const DRAFTS_KEY = "ordin.chat.conversationDrafts"
  const log = document.getElementById("log")
  const input = document.getElementById("input")
  const send = document.getElementById("send")
  const hint = document.getElementById("hint")
  const assetOpen = document.getElementById("asset-open"), assetPicker = document.getElementById("asset-picker"), assetQuery = document.getElementById("asset-query"), assetResults = document.getElementById("asset-results"), assetError = document.getElementById("asset-error"), assetChips = document.getElementById("asset-chips")
  const ASSETS_KEY = "ordin.chat.conversationAssets"
  const ACTIONS_KEY = "ordin.chat.actionIds"
  const assetSelections = (() => { try { const value = JSON.parse(localStorage.getItem(ASSETS_KEY) || "{}"); return value && typeof value === "object" && !Array.isArray(value) ? value : {} } catch { return {} } })()
  let selectedAssets = []
  let assetSearchGeneration = 0
  const modelSelect = document.getElementById("chat-model")
  const list = document.getElementById("conversation-list")
  const title = document.getElementById("conversation-title")
  const titleInput = document.getElementById("conversation-title-input")
  const errorBox = document.getElementById("conversation-error")
  const older = document.getElementById("history-older")
  const taskIdInput = document.getElementById("task-id")
  const continueTask = document.getElementById("continue-task")
  const welcome = document.getElementById("welcome"), workspace = document.getElementById("workspace"), working = document.getElementById("working"), retry = document.getElementById("send-retry"), readiness = document.getElementById("readiness-status")
  const sendFeedback = document.getElementById("send-feedback"), sendRecovery = document.getElementById("send-recovery")
  const sendIssues = new Map()
  const missingActions = new Set(), inFlight = new Set()
  const resendAction = document.getElementById("resend-action")
  const showSendIssue = () => {
    sendFeedback.textContent = sendIssues.get(selectedId) || ""
    sendRecovery.hidden = !sendFeedback.textContent
    resendAction.hidden = !missingActions.has(selectedId) || !actionIds[selectedId]?.payload || !!selected?.archivedAt || inFlight.has(selectedId)
  }
  let conversations = []
  const requested = new URLSearchParams(window.location.search)
  let selectedId = requested.get("conversation") || localStorage.getItem(SELECTED_KEY) || ""
  let selected = null
  let generation = 0
  let cursor = null
  let historyReady = false
  let loading = false
  let creating = false
  let listing = false
  let continuing = false
  const drafts = (() => { try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || "{}") } catch { return {} } })()
  const actionIds = (() => { try { const v = JSON.parse(localStorage.getItem(ACTIONS_KEY) || "{}"); return v && typeof v === "object" ? v : {} } catch { return {} } })()
  const clearAction = (id, action) => {
    if (actionIds[id] !== action) return
    delete actionIds[id]; missingActions.delete(id)
    localStorage.setItem(ACTIONS_KEY, JSON.stringify(actionIds))
  }
  const saveDrafts = () => localStorage.setItem(DRAFTS_KEY, JSON.stringify(drafts))
  const saveAssets = () => { if (selectedId) { assetSelections[selectedId] = selectedAssets; localStorage.setItem(ASSETS_KEY, JSON.stringify(assetSelections)) } }
  const renderAssetChips = () => { if (!assetChips) return; assetChips.replaceChildren(); for (const item of selectedAssets) { const chip = document.createElement("span"), label = document.createElement("span"), remove = document.createElement("button"); chip.className = "asset-chip"; label.textContent = String(item.name || item.id) + " · r" + item.revision; remove.type = "button"; remove.textContent = "移除"; remove.setAttribute("aria-label", "移除 " + String(item.name || item.id)); remove.addEventListener("click", () => { selectedAssets = selectedAssets.filter(a => a.id !== item.id); saveAssets(); renderAssetChips() }); chip.append(label, remove); assetChips.appendChild(chip) } }
  const assetRef = item => ({ id: item.id, revision: item.revision, contentHash: item.contentHash })
  const clearSubmittedAssets = (id, refs) => {
    if (!refs?.length) return
    const current = id === selectedId ? selectedAssets : (assetSelections[id] || [])
    const remaining = current.filter(item => !refs.some(ref => ref.id === item.id && ref.revision === item.revision && ref.contentHash === item.contentHash))
    assetSelections[id] = remaining; localStorage.setItem(ASSETS_KEY, JSON.stringify(assetSelections))
    if (id === selectedId) { selectedAssets = remaining; renderAssetChips() }
  }
  const addAsset = item => { if (!selected || selected.archivedAt) throw new Error("请先选择可用对话"); if (!item || item.managed !== true || item.status !== "active" || item.archived === true || !item.id || !Number.isInteger(item.revision) || !item.contentHash) throw new Error("资产不可用或版本信息不完整"); if (selectedAssets.some(a => a.id === item.id)) return; selectedAssets.push({ id: item.id, name: String(item.name || item.id), revision: item.revision, contentHash: item.contentHash }); saveAssets(); renderAssetChips() }
  const searchAssets = async query => {
    if (!assetResults) return
    const token = ++assetSearchGeneration, id = selectedId
    assetError.textContent = ""; assetResults.replaceChildren()
    try {
      const result = await api("assets?limit=200&query=" + encodeURIComponent(query))
      if (token !== assetSearchGeneration || id !== selectedId) return
      for (const item of result.assets || []) {
        if (item.managed !== true || item.status !== "active" || item.archived === true) continue
        const button = document.createElement("button"); button.type = "button"; button.textContent = String(item.name || item.id) + " · r" + item.revision
        button.addEventListener("click", () => { try { addAsset(item); assetPicker.hidden = true } catch (error) { assetError.textContent = error.message } })
        assetResults.appendChild(button)
      }
      if (!assetResults.children.length) assetResults.textContent = "没有可选资产"
    } catch (error) { if (token === assetSearchGeneration && id === selectedId) assetError.textContent = "读取资产失败：" + error.message }
  }
  window.ChatAssets = { add: addAsset, list: () => selectedAssets.map(item => ({ ...item, ref: assetRef(item) })) }
  const api = async (path, options = {}) => {
    const response = await fetch(API + path, { ...options, headers: { "x-ordin-request": "1", ...(options.headers || {}) } })
    const body = await response.json().catch(() => ({}))
    if (!response.ok) { const error = new Error(body.error || body.message || ("请求失败：" + response.status)); error.status = response.status; throw error }
    return body
  }
  const setError = message => { errorBox.textContent = message || "" }
  const add = (role, text, extra) => {
    const row = document.createElement("div")
    row.className = "msg " + role + (extra ? " " + extra : "")
    const bubble = document.createElement("div")
    bubble.className = "bubble"
    bubble.textContent = String(text ?? "")
    row.appendChild(bubble)
    log.appendChild(row)
    welcome.hidden = true; workspace.setAttribute("class", "workspace")
    log.scrollTop = log.scrollHeight
  }
  const showTaskReceipt = (ticketId, task = {}) => {
    const card = document.createElement("section"); card.className = "task-card"; card.setAttribute("data-task-id", ticketId)
    const description = document.createElement("div")
    description.textContent = "任务 " + ticketId + " · " + (task.title || "新任务") + "\n" + (task.state === "claimed" || task.dispatch?.state === "claimed" ? "已派发 · 执行方已领取" : "已创建 · 等待执行方领取")
    const link = document.createElement("a"); link.href = "/ordin/?tab=workspace&ticketId=" + encodeURIComponent(ticketId); link.textContent = "查看任务 →"
    link.addEventListener("click", event => { if (window.parent !== window) { event.preventDefault(); window.parent.postMessage({type:"ordin:navigate",tab:"workspace",ticketId}, window.location.origin) } })
    card.append(description, link); log.appendChild(card)
  }
  const renderList = () => {
    list.replaceChildren()
    for (const conversation of conversations) {
      const button = document.createElement("button")
      button.type = "button"
      button.className = "conversation-item"
      button.setAttribute("data-id", conversation.id)
      button.setAttribute("aria-current", conversation.id === selectedId ? "true" : "false")
      const label = document.createElement("span")
      label.textContent = !conversation.title || conversation.title === "New conversation" ? "新对话" : conversation.title
      button.appendChild(label)
      if (conversation.archivedAt) { const mark = document.createElement("small"); mark.textContent = "已归档"; button.appendChild(mark) }
      button.addEventListener("click", () => selectConversation(conversation.id))
      list.appendChild(button)
    }
  }
  const updateControls = () => {
    title.textContent = !selected?.title || selected.title === "New conversation" ? "新对话" : selected.title
    titleInput.value = selected?.title || ""
    titleInput.hidden = true
    title.hidden = false
    const archived = !!selected?.archivedAt
    document.getElementById("conversation-archive").textContent = archived ? "恢复" : "归档"
    document.getElementById("conversation-archive").disabled = !selected
    document.getElementById("conversation-rename").disabled = !selected
    document.getElementById("conversation-delete").disabled = !selected
    send.disabled = !selected || archived || !historyReady || loading || !!actionIds[selectedId]
    input.disabled = !selected || archived || !historyReady
    if (assetOpen) assetOpen.disabled = !selected || archived
    continueTask.disabled = continuing
    welcome.hidden = !historyReady || !!log.children.length
    workspace.setAttribute("class", welcome.hidden ? "workspace" : "workspace empty")
    working.hidden = !loading
    send.textContent = loading ? "发送中" : "发送"
  }
  const loadHistory = async (id, token, before) => {
    const query = before ? "?before=" + encodeURIComponent(before) + "&limit=50" : "?limit=50"
    const result = await api("conversations/" + encodeURIComponent(id) + "/messages" + query)
    if (id !== selectedId || token !== generation) return
    if (!Array.isArray(result.messages)) throw new Error("历史响应格式不正确")
    const messages = result.messages
    const existing = before ? [...log.children] : []
    log.replaceChildren()
    for (const message of messages) add(message.role === "ordin" || message.role === "assistant" ? "ordin" : "user", message.content ?? message.text ?? "")
    if (before) log.append(...existing)
    cursor = result.nextCursor || null
    older.hidden = !cursor
    historyReady = true
    updateControls()
  }
  const recoverAction = async (id, token) => {
    const action = actionIds[id], actionId = typeof action === "string" ? action : action?.payload?.actionId
    if (typeof actionId !== "string") return
    try {
      const result = await api("conversations/" + encodeURIComponent(id) + "/actions/" + encodeURIComponent(actionId))
      if (id !== selectedId || token !== generation || actionIds[id] !== action) return
      const receipt = result.receipt
      if (!receipt || receipt.id !== actionId || !["received", "finished", "interrupted"].includes(receipt.state)) throw new Error("动作回执格式不正确")
      missingActions.delete(id)
      if (receipt.task?.ticketId) showTaskReceipt(String(receipt.task.ticketId), receipt.task)
      if (receipt.state === "received") {
        sendIssues.set(id, "已收到原请求，但还没有终局回执。请重新读取记录或查看任务工作台；不要重复交办。")
      } else {
        clearAction(id, action)
        if (receipt.task && !receipt.taskError) clearSubmittedAssets(id, action?.payload?.assetRefs)
        if (!receipt.taskError && (receipt.task || receipt.state === "finished") && input.value.trim() === action?.payload?.text) {
          input.value = ""; drafts[id] = ""; saveDrafts()
        }
        if (receipt.taskError) sendIssues.set(id, "原请求有任务操作未成功：" + receipt.taskError + "。草稿保留，请先核对任务工作台。")
        else if (receipt.state === "interrupted") sendIssues.set(id, receipt.task ? "已找到原任务，但原请求未完成。请在任务工作台查看该任务。" : "原请求已中断，未找到建票回执。请先核对任务工作台，再决定是否以新消息重新交办。")
        else sendIssues.delete(id)
      }
      showSendIssue()
    } catch (error) {
      if (id !== selectedId || token !== generation || actionIds[id] !== action) return
      const missing = error.status === 404
      if (missing) missingActions.add(id)
      else missingActions.delete(id)
      sendIssues.set(id, missing
        ? "发送结果未知：尚未找到原请求的回执。你可以查看任务工作台，或再次提交同一条原消息。"
        : "无法读取原请求回执：" + error.message + "。原动作编号已保留。")
    }
    showSendIssue(); updateControls()
  }
  const selectConversation = async id => {
    const next = conversations.find(c => c.id === id)
    if (!next) return
    if (selected) { drafts[selectedId] = input.value; saveDrafts() }
    selectedId = id
    selected = next
    localStorage.setItem(SELECTED_KEY, id)
    const token = ++generation
    cursor = null; historyReady = false; loading = inFlight.has(id)
    input.value = drafts[id] || ""
    selectedAssets = Array.isArray(assetSelections[id]) ? assetSelections[id] : []; renderAssetChips()
    ++assetSearchGeneration; if (assetPicker) assetPicker.hidden = true; assetResults?.replaceChildren()
    showSendIssue()
    log.replaceChildren(); setError(""); renderList(); updateControls()
    try { await loadHistory(id, token, null); await recoverAction(id, token) }
    catch (error) { if (id === selectedId && token === generation) { setError("读取历史失败：" + error.message + "。草稿仍在，请点击「重试历史」；不会发送消息。"); updateControls() } }
  }
  const refreshList = async () => {
    if (listing) return
    listing = true
    const id = selectedId, token = generation
    setError("")
    try {
      const result = await api("conversations?includeArchived=true")
      if (id !== selectedId || token !== generation) return
      if (!Array.isArray(result.conversations)) throw new Error("对话列表响应格式不正确")
      conversations = result.conversations
      renderList()
      const current = conversations.find(c => c.id === selectedId)
      if (current) {
        if (!historyReady) await selectConversation(current.id)
        else { selected = current; updateControls() }
      } else if (selectedId) {
        selected = null; selectedId = ""; localStorage.removeItem(SELECTED_KEY); ++generation
        if (conversations.length) await selectConversation(conversations[0].id)
        else { log.replaceChildren(); updateControls() }
      } else if (conversations.length) await selectConversation(conversations[0].id)
      else await createConversation(true)
    } catch (error) { if (id === selectedId && token === generation) setError("读取对话列表失败：" + error.message + "。保留当前对话和草稿；请手动刷新对话列表。") }
    finally { listing = false }
  }
  const createConversation = async initial => {
    if (creating) return
    creating = true
    document.getElementById("conversation-new").disabled = true
    try {
      const result = await api("conversations", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({}) })
      const conversation = result.conversation
      if (!conversation?.id) throw new Error("新建响应缺少对话 ID")
      conversations = [conversation, ...conversations]
      renderList()
      await selectConversation(conversation.id)
      if (!initial) input.focus()
    } catch (error) { setError("新建对话结果未知：" + error.message + "。请先刷新对话列表核对，不要直接再次新建。") }
    finally { creating = false; document.getElementById("conversation-new").disabled = false }
  }
  const mutateSelected = async (path, method, body) => {
    if (!selected) return
    const id = selected.id, token = generation
    try {
      const result = await api("conversations/" + encodeURIComponent(id) + path, { method, headers: { "content-type": "application/json" }, body: JSON.stringify({ expectedRevision: selected.revision, ...body }) })
      if (id !== selectedId || token !== generation) return
      if (method === "DELETE") {
        conversations = conversations.filter(c => c.id !== id)
        selected = null; selectedId = ""; localStorage.removeItem(SELECTED_KEY); ++generation
        renderList(); log.replaceChildren(); historyReady = false
        if (conversations.length) await selectConversation(conversations[0].id)
        else await createConversation(true)
      } else {
        if (result.conversation?.id !== id) throw new Error("写入响应缺少对应对话")
        selected = result.conversation
        conversations = conversations.map(c => c.id === id ? selected : c)
        renderList(); updateControls()
      }
      setError("")
    } catch (error) { if (id === selectedId && token === generation) setError("对话变更结果未知：" + error.message + "。请先刷新对话列表核对，再决定是否修改。") }
  }
  const continueSelectedTask = async () => {
    const ticketId = taskIdInput.value.trim()
    if (!ticketId || continuing) return
    const originId = selectedId, token = generation
    if (originId) { drafts[originId] = input.value; saveDrafts() }
    continuing = true; setError(""); updateControls()
    try {
      const result = await api("conversations/from-task", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ticketId }) })
      if (originId !== selectedId || token !== generation) return
      const conversation = result.conversation
      if (!conversation?.id) throw new Error("接续响应缺少对话 ID")
      await refreshList()
      if (originId !== selectedId || token !== generation) return
      if (!conversations.some(c => c.id === conversation.id)) conversations = [conversation, ...conversations]
      else conversations = conversations.map(c => c.id === conversation.id ? conversation : c)
      renderList()
      await selectConversation(conversation.id)
      taskIdInput.value = ""
      setError("")
    } catch (error) {
      if (originId === selectedId && token === generation) setError("无法确认是否已开启对话：" + error.message + "。任务 ID 保留；先刷新对话列表核对。")
    } finally {
      continuing = false; updateControls()
    }
  }
  const submit = async (resubmit = false) => {
    const target = selected
    if (!target || target.archivedAt || !historyReady || inFlight.has(target.id)) return
    const id = target.id, token = generation
    const existing = actionIds[id]
    if (resubmit ? !missingActions.has(id) || !existing?.payload : !!existing || !input.value.trim()) return
    const actionId = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16))
    const refs = selectedAssets.map(assetRef)
    const action = existing || { payload: { text: input.value.trim(), actionId, ...(modelSelect.value ? { model: modelSelect.value } : {}), ...(refs.length ? { assetRefs: refs } : {}) } }
    const payload = action.payload
    sendIssues.delete(id); showSendIssue()
    if (!resubmit) add("user", payload.text)
    inFlight.add(id)
    loading = true; updateControls()
    try {
      actionIds[id] = action; localStorage.setItem(ACTIONS_KEY, JSON.stringify(actionIds))
      const body = await api("conversations/" + encodeURIComponent(id) + "/message", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload) })
      if (typeof body?.reply !== "string" && !Array.isArray(body?.sent) && !Array.isArray(body?.toolOutcomes)) throw new Error("未收到有效的发送回执")
      const taskReceipts = (body.toolOutcomes || []).filter(outcome => outcome.name === "create_task").map(outcome => {
        const data = outcome.data || {}
        const ticketId = [data.id, data.ticketId].find(id => typeof id === "string" && id.trim())
        return { outcome, data, ticketId }
      })
      const taskFailed = taskReceipts.some(({ outcome, ticketId }) => outcome.ok !== true || !ticketId)
      const taskCreated = taskReceipts.some(({ outcome, ticketId }) => outcome.ok === true && !!ticketId)
      if (taskCreated && !taskFailed) clearSubmittedAssets(id, payload.assetRefs)
      clearAction(id, action)
      if (!taskFailed && drafts[id]?.trim() === payload.text) { drafts[id] = ""; saveDrafts() }
      if (id !== selectedId) return
      if (token !== generation || resubmit) await loadHistory(id, generation, null)
      if (id !== selectedId) return
      if (token === generation && !resubmit) {
      for (const line of body.sent || []) add("ordin", String(line))
      if (!(body.sent || []).length) add("ordin", String(body.reply ?? ""))
      }
      let taskError = false
      for (const { outcome, data, ticketId } of taskReceipts) {
        if (outcome.ok !== true) { taskError = true; sendIssues.set(id, "未收到任务创建成功的回执：" + String(outcome.error || "原因未知") + "。草稿保留，请先查看任务工作台核对，再决定是否重新交办。"); continue }
        if (!ticketId) { taskError = true; sendIssues.set(id, "任务回执缺少有效任务 ID。草稿保留，请先查看任务工作台核对。"); continue }
        showTaskReceipt(ticketId, data)
      }
      if (!taskError && input.value.trim() === payload.text) input.value = ""
      drafts[id] = input.value; saveDrafts(); showSendIssue()
      const conversation = conversations.find(c => c.id === id)
      if (conversation) { conversation.title = body.title || conversation.title; conversation.lastMessageAt = body.lastMessageAt || conversation.lastMessageAt; renderList(); title.textContent = conversation.title }
      setError("")
    } catch (error) {
      if ([400, 404, 501].includes(error.status)) clearAction(id, action)
      sendIssues.set(id, "发送结果未知：" + error.message + "。请求可能已处理；草稿保留，请先读取对话记录并查看任务工作台，再决定是否重新发送。")
      if (id === selectedId) {
        showSendIssue()
        if (actionIds[id]) await recoverAction(id, generation)
      }
    }
    finally { inFlight.delete(id); if (id === selectedId) { loading = false; showSendIssue(); updateControls(); input.focus() } }
  }
  const loadModels = async () => {
    try {
      const config = await api("model/config")
      const previous = modelSelect.value
      const ids = [...new Set([...(config.models || []), ...(config.defaultModel ? [config.defaultModel] : [])])]
      modelSelect.replaceChildren(...["", ...ids].map(id => { const option = document.createElement("option"); option.value = id; option.textContent = id || ("使用默认模型" + (config.defaultModel ? "（" + config.defaultModel + "）" : "")); return option }))
      modelSelect.value = ids.includes(previous) ? previous : ""
      readiness.textContent = (config.configuration === "ready" ? "默认模型：" + config.defaultModel : "模型配置未完整") + " · " + (({ available: '已读取密钥', not_required: '未提供密钥', missing_named_env: '缺少指定环境变量', invalid: '密钥无效' }[config.credential] || '密钥状态未知')) + " · " + (config.modelCheck?.state === "passed" ? "连接检查通过" : config.modelCheck?.state === "failed" ? "最近连接检查失败" : "连接尚未检查")
    } catch (error) { readiness.textContent = "未能读取模型状态 · 检查设置" }
    try { const status = await api("execution/status"); readiness.textContent += status.health?.ok ? " · 执行方协议检查通过" + (status.health.warnings?.length ? "（有能力限制，请查看设置）" : "") : " · 执行方状态未确认" } catch { readiness.textContent += " · 未能读取执行状态，检查设置" }
  }
  assetOpen?.addEventListener("click", () => { assetPicker.hidden = !assetPicker.hidden; if (!assetPicker.hidden) { assetQuery.focus(); searchAssets(assetQuery.value) } })
  assetQuery?.addEventListener("input", () => searchAssets(assetQuery.value))
  window.addEventListener("message", async event => { if (event.source !== window.parent || event.origin !== window.location.origin || event.data?.type !== "ordin:use-asset" || !event.data.assetRef || !assetPicker) return; const requestedRef = event.data.assetRef, id = selectedId, token = generation; try { if (typeof requestedRef.id !== "string") throw new Error("资产引用无效"); const detail = await api("assets/" + encodeURIComponent(requestedRef.id)); if (id !== selectedId || token !== generation) return; const latest = detail.asset || detail; if (requestedRef.revision !== latest.revision || requestedRef.contentHash !== latest.contentHash) throw new Error("资产版本已变化，请重新选择"); addAsset(latest); assetError.textContent = "" } catch (error) { assetPicker.hidden = false; assetError.textContent = "无法添加资产：" + error.message } })
  document.getElementById("conversation-new").addEventListener("click", () => createConversation(false))
  document.getElementById("conversation-refresh").addEventListener("click", refreshList)
  document.getElementById("history-retry").addEventListener("click", () => selected && selectConversation(selected.id))
  older.addEventListener("click", async () => {
    if (!selected || !cursor) return
    const id = selected.id, token = generation, before = cursor
    try { await loadHistory(id, token, before) } catch (error) { if (id === selectedId && token === generation) setError("读取较早历史失败：" + error.message) }
  })
  document.getElementById("conversation-rename").addEventListener("click", () => {
    if (!selected) return
    if (titleInput.hidden) { title.hidden = true; titleInput.hidden = false; titleInput.focus(); titleInput.select?.(); return }
    const wanted = titleInput.value.trim()
    if (!wanted || wanted === selected.title) { updateControls(); return }
    return mutateSelected("", "PATCH", { title: wanted })
  })
  titleInput.addEventListener("keydown", event => { if (event.key === "Enter" && (event.isComposing || event.keyCode === 229)) return; if (event.key === "Enter") { event.preventDefault(); document.getElementById("conversation-rename").click() } if (event.key === "Escape") updateControls() })
  document.getElementById("conversation-archive").addEventListener("click", () => {
    if (!selected) return
    return mutateSelected(selected.archivedAt ? "/restore" : "/archive", "POST", {})
  })
  document.getElementById("conversation-delete").addEventListener("click", () => {
    if (selected && window.confirm("删除此对话？其任务和结果会保留。")) return mutateSelected("", "DELETE", {})
  })
  input.addEventListener("input", () => { if (selectedId) { drafts[selectedId] = input.value; saveDrafts() } })
  send.addEventListener("click", () => submit())
  resendAction.addEventListener("click", () => submit(true))
  continueTask.addEventListener("click", continueSelectedTask)
  input.addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) { event.preventDefault(); return submit() } })
  for (const [id, text] of [["example-summarize","请帮我总结下面的内容，并提炼关键要点：\n\n"],["example-plan","请帮我把这件事拆解成清晰的工作计划：\n\n"],["example-explain","请帮我分析这个问题，先问我需要补充的信息：\n\n"]]) document.getElementById(id).addEventListener("click", () => { input.value = text; if (selectedId) { drafts[selectedId] = text; saveDrafts() } input.focus() })
  retry.addEventListener("click", () => selected && !loading && selectConversation(selected.id))
  document.getElementById("review-tasks").addEventListener("click", event => { if (window.parent !== window) { event.preventDefault(); window.parent.postMessage({type:"ordin:navigate",tab:"workspace"}, window.location.origin) } })
  document.getElementById("settings-open").addEventListener("click", () => { if (window.parent !== window) window.parent.postMessage({type:"ordin:navigate",tab:"settings"}, window.location.origin); else window.location.href = "/ordin/#settings" })
  window.addEventListener("focus", loadModels)
  loadModels()
  const initialize = async () => {
    await refreshList()
    if (window.parent !== window) window.parent.postMessage({type:"ordin:chat-ready"},window.location.origin)
    const requestedTask = requested.get("task")
    if (requestedTask) {
      requested.delete("task")
      window.history.replaceState(null, "", "/ordin/chat" + (requested.toString() ? "?" + requested.toString() : ""))
      taskIdInput.value = requestedTask
      await continueSelectedTask()
    }
  }
  initialize()
})()
</script>
